name: Build BMW E46 TECH 2.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BMW_E46_TECH_2.3_GITHUB_UPLOAD.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          set -e
          mkdir -p package source

          unzip -q BMW_E46_TECH_2.3_GITHUB_UPLOAD.zip -d package

          unzip -q package/BMW_E46_TECH_2.3_LOGO.zip -d source

          PROJECT_DIR="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)"

          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-E46-TECH-2.3-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
